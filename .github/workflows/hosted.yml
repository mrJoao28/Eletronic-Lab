name: Validate hosted laboratory
on:
  deployment_status:
  push:
    branches: [test/hosted-quality, ops/error-monitoring-release]
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact HTTPS deployment URL to verify
        required: true
      candidate_sha:
        description: Commit SHA verified in the Vercel deployment metadata
        required: true
permissions:
  contents: read
jobs:
  hosted:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url || 'https://eletronic-c2ewlqly7-mrjoao28s-projects.vercel.app' }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.deployment.sha || '58e1b87adf7467c9e896931ebdad3333e96e8580' }}
      LAB_EXPECTED_COMMIT: ${{ inputs.candidate_sha || github.event.deployment.sha || '58e1b87adf7467c9e896931ebdad3333e96e8580' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: |
          echo "Tested URL: $LAB_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 14
